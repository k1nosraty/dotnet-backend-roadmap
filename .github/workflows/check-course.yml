name: Check course
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check lesson metadata and Markdown links
        run: python3 scripts/check_content.py
      - name: Build samples and check behavior
        run: python3 scripts/smoke.py
