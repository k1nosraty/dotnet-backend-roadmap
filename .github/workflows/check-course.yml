name: Check course
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check lesson metadata and Markdown links
        run: python scripts/check_content.py
      - name: Build samples and check behavior
        run: python scripts/smoke.py

      - name: Check real HTTP requests against ASP.NET Core samples
        run: python scripts/web_smoke.py

      - name: Check controller API snapshots and published delivery
        run: python scripts/controller_smoke.py

      - name: Check domain contracts independently of HTTP
        run: python scripts/domain_smoke.py
