name: Check course
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check lesson metadata and Markdown links
        run: python scripts/check_content.py
      - name: Build samples and check behavior
        run: python scripts/smoke.py

      - name: Check real HTTP requests against ASP.NET Core samples
        run: python scripts/web_smoke.py

      - name: Check controller API snapshots and published delivery
        run: python scripts/controller_smoke.py

      - name: Check domain contracts independently of HTTP
        run: python scripts/domain_smoke.py

      - name: Build PostgreSQL lesson samples on Windows
        if: runner.os == 'Windows'
        run: python scripts/postgres_smoke.py --build-only

      - name: Build EF and Dapper samples on Windows
        if: runner.os == 'Windows'
        run: python scripts/ef_smoke.py --build-only

  postgres:
    name: PostgreSQL 18 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_USER: course
          POSTGRES_PASSWORD: course-ci-only
          POSTGRES_DB: supportdesk_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U course -d supportdesk_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONUTF8: '1'
      SUPPORTDESK_PG: Host=127.0.0.1;Port=5432;Database=supportdesk_lab;Username=course;Password=course-ci-only;Timeout=10;Command Timeout=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run SQL and Npgsql lessons against real PostgreSQL
        run: python scripts/postgres_smoke.py

      - name: Check EF migrations, concurrency and persistent HTTP API
        run: python scripts/ef_smoke.py
